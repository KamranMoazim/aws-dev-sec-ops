services:
  app:
    build:
      context: ./app
      args:
        APP_VERSION: local
    ports:
      - '3000:3000'
    environment:
      DB_HOST: db
      DB_USER: hello
      DB_PASSWORD: local-only-password
      DB_NAME: hello
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hello
      POSTGRES_PASSWORD: local-only-password
      POSTGRES_DB: hello
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hello -d hello']
      interval: 5s
      timeout: 3s
      retries: 10
