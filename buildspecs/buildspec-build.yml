version: 0.2

env:
  exported-variables:
    - IMAGE_TAG
    - IMAGE_URI

phases:
  pre_build:
    commands:
      - IMAGE_TAG="$(echo "$COMMIT_ID" | cut -c1-7)"
      - IMAGE_URI="$ECR_REPOSITORY_URL:$IMAGE_TAG"
      - aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_REPOSITORY_URL%%/*}"
  build:
    on-failure: ABORT
    commands:
      - docker build --target test app
      - docker build --provenance=false --sbom=false --build-arg APP_VERSION="$IMAGE_TAG" -t "$IMAGE_URI" app
      - scripts/ci/push-image.sh "$ECR_REPOSITORY_URL" "$IMAGE_TAG"
      - printf '[{"name":"%s","imageUri":"%s"}]' "$CONTAINER_NAME" "$IMAGE_URI" > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
