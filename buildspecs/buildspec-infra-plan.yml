version: 0.2

env:
  shell: bash
  exported-variables:
    - PLAN_SUMMARY

phases:
  install:
    commands:
      - scripts/security/install-tools.sh terraform
  build:
    on-failure: ABORT
    commands:
      - scripts/ci/terraform-plan.sh "$ENVIRONMENT"
      - mkdir -p plan-output && cp infra/aws/envs/"$ENVIRONMENT"/{tfplan,plan.txt} plan-output/
      - 'PLAN_SUMMARY="$ENVIRONMENT: $(cat infra/aws/envs/"$ENVIRONMENT"/plan-summary.txt)"'

artifacts:
  base-directory: plan-output
  files:
    - tfplan
    - plan.txt
